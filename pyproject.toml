[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "Build a small language model from scratch to understand how LLMs work."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"